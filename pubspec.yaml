name: openalbion_weaponry
description: A new Flutter project.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.10+14

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

   #model control
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  freezed: ^2.5.2

  #networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2
  connectivity_plus: ^7.1.1
  dartz: 0.10.1

  #state management
  provider: ^6.1.5+1

  #ui
  fluttertoast: ^9.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  dropdown_button2: ^2.3.9
  dotted_border: ^3.1.0
  flutter_custom_dialog: 1.3.0
  dotted_line: ^3.2.3
  flutter_xlider: 3.5.0

  #helper
  change_app_package_name: ^1.5.0
  package_info_plus: ^10.1.0
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  shake: ^3.0.0

  #local notification
  # flutter_local_notifications: 16.0.0

  #localization
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  firebase_messaging: ^16.2.2

  #persistence
  shared_preferences: ^2.5.5
  hive: 2.2.3
  hive_flutter: 1.1.0

dev_dependencies:
  hive_generator: ^2.0.1  
  build_runner:
  retrofit_generator: ^8.2.1
  
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/svgs/
    - assets/images/pngs/
    - assets/fonts/inter/
    - assets/mock_json/
    - .env


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/inter.ttf
